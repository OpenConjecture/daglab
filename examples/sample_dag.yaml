name: sample_data_pipeline
description: A sample data processing pipeline

nodes:
  - id: data_source
    type: function
    function: load_data
    config:
      source: "data/input.csv"
      
  - id: clean_data
    type: function
    function: clean_data
    config:
      remove_nulls: true
      normalize: true
      
  - id: transform_data
    type: function
    function: transform_data
    config:
      operations:
        - type: aggregate
          columns: ["sales", "revenue"]
        - type: pivot
          index: "date"
          columns: "category"
          
  - id: analyze_data
    type: function
    function: analyze_data
    config:
      metrics: ["mean", "std", "correlation"]
      
  - id: save_results
    type: function
    function: save_results
    config:
      output_path: "data/results.parquet"
      format: "parquet"

edges:
  - source: data_source
    target: clean_data
    
  - source: clean_data
    target: transform_data
    
  - source: transform_data
    target: analyze_data
    
  - source: analyze_data
    target: save_results

metadata:
  author: "DAGLab Team"
  version: "1.0.0"
  tags: ["etl", "data-processing", "analytics"]

execution:
  backend: "dask"
  config:
    n_workers: 4
    memory_limit: "4GB"
    
monitoring:
  enabled: true
  metrics:
    - execution_time
    - memory_usage
    - cpu_usage