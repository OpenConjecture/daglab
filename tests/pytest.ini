[tool:pytest]
# Pytest configuration for DagLab testing suite
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=daglab
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=90
    --tb=short
    --maxfail=5
    --durations=10
    --hypothesis-show-statistics
    --benchmark-only
    --benchmark-autosave
    --benchmark-storage=tests/benchmarks
    -p no:warnings

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external services)
    e2e: End-to-end tests (slowest, full workflow)
    performance: Performance and benchmark tests
    security: Security-focused tests
    property: Property-based testing with Hypothesis
    slow: Slow running tests
    network: Tests requiring network access
    database: Tests requiring database access
    cloud: Tests requiring cloud services
    smoke: Smoke tests for basic functionality
    regression: Regression tests for bug fixes
    flaky: Tests that may be flaky
    skip_ci: Skip in CI environment
    memory_intensive: Tests that use significant memory
    cpu_intensive: Tests that use significant CPU

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution
addopts = -n auto

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    error::UserWarning

# Coverage settings
[coverage:run]
source = src/daglab
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */build/*
    */dist/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# HTML coverage report
[coverage:html]
directory = tests/coverage_html
title = DagLab Test Coverage Report

# XML coverage report for CI
[coverage:xml]
output = tests/coverage.xml