# Development environment configuration
version: "1.0"
notebooks_dir: "./dev/notebooks"

dagster:
  project_dir: "./dev/dagster_project"
  assets_module: "dev_assets"

marimo:
  port_range_start: 3000
  port_range_end: 3100
  auto_reload: true
  theme: "dark"

defaults:
  author: "Developer"
  python_version: "3.11"

performance:
  max_workers: 8
  timeout: 600
  cache_enabled: true

logging:
  level: "DEBUG"
  file: "./dev/logs/daglab.log"
  json_format: true

telemetry:
  enabled: false

security:
  sandbox_enabled: false  # Disabled for development
  validate_inputs: true