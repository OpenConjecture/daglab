name: Performance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-perf-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-perf-${{ matrix.python-version }}-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,performance]"
          pip install pytest-benchmark airspeed asv memory-profiler
          
      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark_results.json
          
      - name: Run memory profiling
        run: |
          python -m memory_profiler tests/memory_profile.py > memory_results.txt
          
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          # Checkout base branch
          git checkout ${{ github.base_ref }}
          pip install -e ".[test,performance]"
          pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark_baseline.json
          
          # Compare results
          python scripts/compare_benchmarks.py benchmark_baseline.json benchmark_results.json
          
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            benchmark_results.json
            memory_results.txt
            
      - name: Store benchmark result
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Python ${{ matrix.python-version }} Benchmark
          tool: 'pytest'
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          
  profiling:
    name: CPU and Memory Profiling
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,performance]"
          pip install py-spy scalene pyflame austin-python memray
          
      - name: CPU profiling with py-spy
        run: |
          py-spy record -o profile_cpu.svg -d 60 -- python examples/performance_test.py
          
      - name: Memory profiling with memray
        run: |
          memray run -o profile_memory.bin python examples/performance_test.py
          memray flamegraph profile_memory.bin -o profile_memory.html
          
      - name: Combined profiling with scalene
        run: |
          scalene --html --outfile profile_scalene.html examples/performance_test.py
          
      - name: Upload profiling results
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: |
            profile_*.svg
            profile_*.html
            profile_*.bin
            
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
          
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daglab_perf
        ports:
          - 5432:5432
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,all]"
          pip install locust pytest-stress
          
      - name: Run load tests
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daglab_perf
        run: |
          # Start the application
          python -m daglab.server &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Run load tests
          locust -f tests/load/locustfile.py --headless -u 100 -r 10 -t 5m --html report.html
          
          # Stop server
          kill $SERVER_PID
          
      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            report.html
            
  regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install ASV
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv
          
      - name: Run ASV benchmarks
        run: |
          asv machine --machine github-actions
          asv run HEAD~5..HEAD --skip-existing --quick
          asv compare HEAD~1 HEAD
          
      - name: Generate regression report
        run: |
          asv publish
          asv preview --html-dir regression_report
          
      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('regression_report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Performance Regression Report\n\n' + report
            })
            
      - name: Upload regression report
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression_report/