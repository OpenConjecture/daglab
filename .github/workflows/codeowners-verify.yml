name: CODEOWNERS Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify:
    name: Verify CODEOWNERS
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify CODEOWNERS syntax
        uses: mszostok/codeowners-validator@v0.7.4
        with:
          checks: "syntax,files,duppatterns,owners"
          owner_checker_owners_must_be_teams: "false"
          
      - name: Check required approvals
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const approvedReviews = reviews.filter(r => r.state === 'APPROVED');
            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Check if critical files are modified
            const criticalPaths = [
              'src/daglab/core/',
              'src/daglab/runtime/',
              '.github/workflows/',
              'pyproject.toml'
            ];
            
            const criticalChanges = changedFiles.data.some(file => 
              criticalPaths.some(path => file.filename.startsWith(path))
            );
            
            if (criticalChanges && approvedReviews.length < 2) {
              core.setFailed('Critical files modified. Requires 2 approvals.');
            }