# git-cliff configuration for changelog generation

[changelog]
# Header template for the changelog
header = """
# Changelog
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Body template for the changelog
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}{% if commit.breaking %} [**BREAKING**]{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
# Footer template for the changelog
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse the commits based on conventional commits
conventional_commits = true
# Filter commits
filter_unconventional = true
# Commit message processor
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/openconjecture/daglab/issues/${2}))" },
]
# Commit groups
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^build", group = "Build System" },
    { body = ".*security", group = "Security" },
    { message = "^revert", group = "Revert" },
]
# Filter out commits
filter_commits = true
# Sorting
sort_commits = "newest"