# DagLab Security Configuration
# Comprehensive security settings for production deployment

# Audit Configuration
audit:
  enabled: true
  scan_dependencies: true
  scan_code: true
  analyze_configs: true
  check_compliance: true
  
  # Paths to exclude from scanning
  excluded_paths:
    - ".git"
    - "__pycache__"
    - "node_modules"
    - ".venv"
    - "venv"
    - "*.pyc"
    - "*.pyo"
    - "*.egg-info"
    - "build/"
    - "dist/"
  
  # Minimum severity level to report
  severity_threshold: "medium"
  
  # Maximum findings to report
  max_findings: 1000
  
  # Audit timeout in seconds
  timeout_seconds: 3600
  
  # Report configuration
  reports:
    formats: ["json", "html"]
    output_directory: "security_audit"
    include_sbom: true
    include_threat_model: true

# Authentication Hardening
authentication:
  password_policy:
    min_length: 12
    max_length: 128
    require_uppercase: true
    require_lowercase: true
    require_digits: true
    require_special_chars: true
    min_special_chars: 1
    disallow_common_passwords: true
    disallow_personal_info: true
    password_history_count: 12
    max_age_days: 90
  
  multi_factor_auth:
    enabled: true
    require_for_admin: true
    require_for_sensitive_ops: true
    supported_factors:
      - "totp"
      - "webauthn"
      - "sms"  # Less secure, consider for accessibility only
    backup_codes:
      enabled: true
      count: 10
      single_use: true
    grace_period_days: 7
    remember_device_days: 30
  
  session_security:
    session_timeout_minutes: 30
    absolute_timeout_minutes: 480  # 8 hours
    idle_timeout_minutes: 15
    secure_cookies: true
    httponly_cookies: true
    samesite_cookies: "Strict"
    session_token_entropy_bits: 256
    regenerate_on_login: true
    regenerate_on_privilege_change: true
  
  account_lockout:
    enabled: true
    max_failed_attempts: 5
    lockout_duration_minutes: 30
    progressive_lockout: true
    lockout_thresholds:
      1: 5    # 5 minutes after first lockout
      2: 30   # 30 minutes after second lockout
      3: 120  # 2 hours after third lockout
      4: 1440 # 24 hours after fourth lockout
    ip_based_lockout: true
    max_ip_attempts_per_hour: 50
    notification_on_lockout: true

# Input Validation and Sanitization
input_validation:
  sanitization:
    max_string_length: 10000
    remove_html_tags: true
    normalize_unicode: true
    trim_whitespace: true
    escape_html: true
    disallow_control_chars: true
  
  sql_injection_prevention:
    use_parameterized_queries: true
    escape_sql_chars: true
    validate_sql_patterns: true
    blocked_sql_keywords:
      - "DROP"
      - "DELETE"
      - "TRUNCATE"
      - "ALTER"
      - "CREATE"
      - "EXEC"
      - "EXECUTE"
      - "UNION"
      - "INSERT"
      - "UPDATE"
  
  xss_prevention:
    html_escape: true
    javascript_escape: true
    css_escape: true
    url_encode: true
    content_security_policy: true
  
  file_upload_security:
    allowed_extensions: [".txt", ".csv", ".json", ".yaml", ".yml"]
    max_file_size_mb: 10
    scan_for_malware: true
    validate_mime_types: true
    quarantine_suspicious_files: true
  
  rate_limiting:
    enabled: true
    global_limits:
      requests_per_minute: 1000
      requests_per_hour: 10000
      requests_per_day: 100000
    
    endpoint_specific_limits:
      auth_endpoints:
        login:
          requests_per_minute: 5
          burst: 10
        password_reset:
          requests_per_minute: 2
          burst: 5
        registration:
          requests_per_minute: 3
          burst: 7
      
      api_endpoints:
        data_query:
          requests_per_minute: 100
          burst: 200
        file_upload:
          requests_per_minute: 10
          burst: 20
        admin_operations:
          requests_per_minute: 20
          burst: 30
    
    user_based_limits:
      free_tier:
        requests_per_hour: 100
      premium_tier:
        requests_per_hour: 1000
      enterprise_tier:
        requests_per_hour: 10000
    
    ip_based_limits:
      same_ip_requests_per_minute: 200
      suspicious_ip_threshold: 500
      auto_block_duration_minutes: 60
    
    storage:
      backend: "redis"  # or "memory", "database"
      key_prefix: "daglab:ratelimit:"
      ttl_seconds: 3600
  
  csrf_protection:
    enabled: true
    token_lifetime_minutes: 60
    cookie_name: "csrftoken"
    header_name: "X-CSRFToken"
    form_field_name: "csrfmiddlewaretoken"
    double_submit_cookie: true
    require_referrer_check: true
    require_https_referrer: true
    cookie_secure: true
    cookie_httponly: false  # Must be false for JS access
    cookie_samesite: "Strict"

# Network Security
network_security:
  https_enforcement:
    enabled: true
    redirect_http_to_https: true
    hsts_enabled: true
    hsts_max_age_seconds: 31536000  # 1 year
    hsts_include_subdomains: true
    hsts_preload: true
  
  security_headers:
    enabled: true
    headers:
      # Prevent clickjacking
      X-Frame-Options: "DENY"
      
      # XSS protection
      X-XSS-Protection: "1; mode=block"
      
      # MIME type sniffing protection
      X-Content-Type-Options: "nosniff"
      
      # Referrer policy
      Referrer-Policy: "strict-origin-when-cross-origin"
      
      # Content Security Policy
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"
      
      # Permissions policy
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
  
  cors_configuration:
    enabled: true
    allowed_origins: []  # Should be configured with specific origins
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-CSRFToken"]
    allow_credentials: true
    max_age_seconds: 3600
    expose_headers: ["X-RateLimit-Limit", "X-RateLimit-Remaining"]
  
  tls_configuration:
    min_version: "1.2"
    preferred_version: "1.3"
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
      - "ECDHE-RSA-AES256-GCM-SHA384"
      - "ECDHE-RSA-AES128-GCM-SHA256"
    disable_weak_ciphers: true

# Configuration Security
configuration_security:
  secrets_management:
    enabled: true
    use_environment_variables: true
    use_external_secret_manager: false
    secret_manager_type: "vault"  # or "aws_secrets", "azure_keyvault"
    encrypt_secrets_at_rest: true
    rotate_secrets_regularly: true
    secret_rotation_days: 90
  
  file_permissions:
    enforce_secure_permissions: true
    config_file_mode: "0600"
    log_file_mode: "0640"
    data_directory_mode: "0750"
    executable_mode: "0755"
  
  default_security_settings:
    debug_mode: false
    verbose_error_messages: false
    expose_server_info: false
    enable_directory_listing: false
    hide_version_info: true
  
  environment_separation:
    enforce_environment_configs: true
    development:
      debug_allowed: true
      test_data_allowed: true
      external_access_allowed: false
    
    staging:
      debug_allowed: false
      test_data_allowed: true
      external_access_allowed: true
      monitoring_required: true
    
    production:
      debug_allowed: false
      test_data_allowed: false
      external_access_allowed: true
      monitoring_required: true
      audit_logging_required: true

# Security Monitoring
monitoring:
  enabled: true
  
  security_events:
    log_authentication_events: true
    log_authorization_failures: true
    log_input_validation_failures: true
    log_rate_limiting_violations: true
    log_csrf_token_failures: true
    log_configuration_changes: true
    log_admin_operations: true
  
  anomaly_detection:
    enabled: true
    detect_unusual_login_patterns: true
    detect_privilege_escalation: true
    detect_data_exfiltration: true
    detect_brute_force_attacks: true
    detect_injection_attempts: true
  
  alerting:
    enabled: true
    alert_channels: ["email", "slack"]  # Configure as needed
    
    critical_alerts:
      - "multiple_failed_login_attempts"
      - "privilege_escalation_detected"
      - "data_breach_indicators"
      - "system_compromise_indicators"
    
    alert_thresholds:
      failed_login_attempts: 10
      rate_limit_violations: 100
      suspicious_ip_requests: 500
      error_rate_percentage: 5
  
  log_retention:
    security_logs_retention_days: 365
    audit_logs_retention_days: 2555  # 7 years for compliance
    access_logs_retention_days: 90
    error_logs_retention_days: 180

# Compliance Settings
compliance:
  gdpr:
    enabled: true
    data_protection_measures:
      encryption_at_rest: true
      encryption_in_transit: true
      pseudonymization: true
      access_controls: true
      audit_logging: true
    
    user_rights:
      right_to_access: true
      right_to_rectification: true
      right_to_erasure: true
      right_to_portability: true
      right_to_restrict_processing: true
    
    breach_notification:
      enabled: true
      notification_within_hours: 72
      include_supervisory_authority: true
      include_affected_individuals: true
  
  sox:
    enabled: false  # Enable if applicable
    internal_controls:
      segregation_of_duties: true
      access_controls: true
      change_management: true
      audit_trails: true
    
    financial_reporting_controls:
      data_integrity: true
      system_reliability: true
      security_controls: true
  
  pci_dss:
    enabled: false  # Enable if processing payment data
    requirements:
      secure_network: true
      protect_cardholder_data: true
      vulnerability_management: true
      access_controls: true
      monitoring: true
      information_security_policy: true

# Risk Management
risk_management:
  risk_assessment:
    frequency_months: 6
    include_threat_modeling: true
    include_vulnerability_assessment: true
    include_business_impact_analysis: true
  
  risk_tolerance:
    acceptable_risk_score: 30  # 0-100 scale
    critical_risk_threshold: 80
    high_risk_threshold: 60
    medium_risk_threshold: 30
  
  risk_mitigation:
    implement_compensating_controls: true
    regular_security_training: true
    incident_response_plan: true
    business_continuity_plan: true
    disaster_recovery_plan: true

# Incident Response
incident_response:
  enabled: true
  
  response_team:
    security_lead: "security@company.com"
    technical_lead: "devops@company.com"
    management_contact: "management@company.com"
    legal_contact: "legal@company.com"
  
  response_procedures:
    detection_and_analysis: true
    containment_eradication_recovery: true
    post_incident_activities: true
  
  communication_plan:
    internal_notification: true
    external_notification: true
    regulatory_notification: true
    customer_notification: true
  
  recovery_procedures:
    backup_restoration: true
    system_rebuilding: true
    evidence_preservation: true
    lessons_learned: true