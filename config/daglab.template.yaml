# DagLab Configuration Template
# Copy this file to daglab.yaml and customize as needed

# Global settings
project_name: daglab
version: 0.1.0
environment: development  # development, staging, production, test
debug: true

# Dagster configuration
dagster:
  home: ~/.dagster
  repository_name: daglab_repository
  job_name: daglab_job
  run_launcher: default
  storage:
    filesystem:
      base_dir: dagster_storage
  event_log_storage:
    sqlite:
      base_dir: dagster_events
  compute_log_manager:
    module: dagster.core.storage.local_compute_log_manager
    class: LocalComputeLogManager

# Marimo configuration
marimo:
  host: 127.0.0.1
  port: 2718
  auto_open: true
  theme: light  # light, dark, auto
  notebook_dir: ./notebooks
  autosave: true
  autosave_interval: 30

# Default values
defaults:
  execution_timeout: 300
  retry_count: 3
  retry_delay: 1.0
  batch_size: 100
  parallelism: 4
  temp_dir: /tmp/daglab

# Performance settings
performance:
  cache_enabled: true
  cache_size: 1000
  cache_ttl: 3600
  memory_limit: 4G
  cpu_limit: null
  enable_profiling: false
  profile_output_dir: ./profiles

# Export settings
export:
  default_format: yaml  # yaml, json, python, markdown
  output_dir: ./exports
  include_metadata: true
  pretty_print: true
  compression: null  # gzip, zip, null

# Logging configuration
logging:
  level: info  # debug, info, warning, error, critical
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  max_file_size: 10M
  backup_count: 5
  console_output: true
  structured: false

# Telemetry settings
telemetry:
  enabled: false
  endpoint: null
  api_key: null
  sample_rate: 1.0
  include_system_info: true
  flush_interval: 60

# Security configuration
security:
  mode: moderate  # strict, moderate, relaxed
  enable_ssl: false
  ssl_cert: null
  ssl_key: null
  allowed_hosts:
    - localhost
    - 127.0.0.1
  enable_auth: false
  auth_token: null
  encrypt_storage: false