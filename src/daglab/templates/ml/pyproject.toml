[tool.poetry]
name = "dagster-ml-project"
version = "0.1.0"
description = "A Dagster ML project with daglab integration"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
dagster = "^1.5"
dagster-webserver = "^1.5"
daglab = "^0.1.0"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.3"
matplotlib = "^3.7"
seaborn = "^0.12"
joblib = "^1.3"
jupyter = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^23.0"
ruff = "^0.1.0"
mypy = "^1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"