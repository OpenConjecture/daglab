version: '3.8'

services:
  daglab:
    build: .
    image: daglab:latest
    container_name: daglab
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./examples:/app/examples
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - DAGLAB_ENV=development
    command: /bin/bash
    stdin_open: true
    tty: true

  redis:
    image: redis:7-alpine
    container_name: daglab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: daglab-postgres
    environment:
      - POSTGRES_DB=daglab
      - POSTGRES_USER=daglab
      - POSTGRES_PASSWORD=daglab123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ray-head:
    image: rayproject/ray:latest
    container_name: daglab-ray-head
    shm_size: '2gb'
    ports:
      - "8265:8265"
      - "10001:10001"
    command: ray start --head --dashboard-host 0.0.0.0
    environment:
      - RAY_ADDRESS=auto

  dask-scheduler:
    image: daskdev/dask:latest
    container_name: daglab-dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    command: dask-scheduler

  dask-worker:
    image: daskdev/dask:latest
    container_name: daglab-dask-worker
    command: dask-worker tcp://dask-scheduler:8786
    depends_on:
      - dask-scheduler
    environment:
      - DASK_SCHEDULER_ADDRESS=tcp://dask-scheduler:8786

volumes:
  redis_data:
  postgres_data: