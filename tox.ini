[tox]
envlist = py{38,39,310,311}, lint, type, docs
isolated_build = True

[testenv]
deps =
    pytest>=7.2.0
    pytest-cov>=4.0.0
    pytest-asyncio>=0.20.0
    pytest-mock>=3.10.0
    hypothesis>=6.70.0
commands =
    pytest tests/ {posargs} -v --cov=daglab --cov-report=term-missing

[testenv:lint]
deps =
    black>=23.0.0
    ruff>=0.0.260
    isort>=5.12.0
commands =
    black --check src/ tests/
    isort --check-only src/ tests/
    ruff check src/ tests/

[testenv:type]
deps =
    mypy>=1.0.0
    types-all
commands =
    mypy src/daglab

[testenv:docs]
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
    myst-parser>=1.0.0
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:format]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black src/ tests/
    isort src/ tests/